name: Materialize and validate DATA-333

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/bootstrap-auto-debug
    paths:
      - 'materialized_payload_v5/**'
      - 'database/**'
      - 'analysis/**'
      - 'research/**'
      - 'tools/materialize_auto_debug.py'
      - '.github/workflows/materialize-auto-debug.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct and expand canonical high-volume database payload
        shell: bash
        run: |
          set -euo pipefail
          test -s materialized_payload_v5/chunk_00
          test -s materialized_payload_v5/chunk_09
          cat materialized_payload_v5/chunk_* | base64 -d > /tmp/database-high-volume.tar.xz
          xz -t /tmp/database-high-volume.tar.xz
          tar -tJf /tmp/database-high-volume.tar.xz >/dev/null
          tar -xJf /tmp/database-high-volume.tar.xz -C .

      - name: Refresh manifest and validate database
        run: python tools/materialize_auto_debug.py --repo-root . --refresh-manifest --validate-only

      - name: Verify routing entrypoints and high-volume datasets
        shell: bash
        run: |
          set -euo pipefail
          test -f AI_BOOTSTRAP.md
          test -f AI_ROUTER.md
          test -f AUTO_FEATURE_READINESS.md
          test -f database/TOOL_DATA_INDEX.md
          test -f database/SUBSYSTEM_SOURCE_MAP.md
          test -f database/SEMANTIC_JOIN_MAP.md
          test -f database/features/CORE_METHOD_RVA_INDEX.csv
          test -f database/features/FEATURE_METHOD_MAP.csv
          test -f database/features/FEATURE_ASSET_MAP.csv
          test -f database/dotnet/DEVICE_STATE_CATALOG.csv
          test -f database/dotnet/METHOD_CATALOG_0001_0600.csv
          test -f database/dotnet/METHOD_CATALOG_0601_1200.csv
          test -f database/dotnet/METHOD_CATALOG_1201_1294.csv
          test -f database/dotnet/PDB_IDENTIFIERS.csv
          test -f database/control/CONTROL_CALL_CHAINS.csv
          test -f database/control/KAUTOHELPER_CALL_GRAPH.csv
          test -f database/assets/ASSET_ROLE_CATALOG.csv
          test -f database/assets/IMAGE_TEMPLATE_INDEX_0001_0700.csv
          test -f database/assets/IMAGE_TEMPLATE_INDEX_0701_1393.csv
          test -f database/snapshot/ARTIFACT_MANIFEST_0001_0750.csv
          test -f database/snapshot/ARTIFACT_MANIFEST_0751_1450.csv
          test -f research/AUTO_RUNTIME_PROOF_QUEUE.md

      - name: Commit materialized database when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- database; then
            echo 'Canonical database already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database
          git commit -m 'data: materialize complete DATA-333 high-volume database'
          git push
