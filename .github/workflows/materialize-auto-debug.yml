# Canonical DATA-333 CSV/JSON datasets are committed directly; no transport payload is required.
name: Validate DATA-333

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - analysis/bootstrap-auto-debug
    paths:
      - 'database/**'
      - 'analysis/**'
      - 'research/**'
      - 'tools/materialize_auto_debug.py'
      - 'AI_BOOTSTRAP.md'
      - 'AI_ROUTER.md'
      - 'AUTO_FEATURE_READINESS.md'
      - '.github/workflows/materialize-auto-debug.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical materialized database
        run: python tools/materialize_auto_debug.py --repo-root . --validate-only
      - name: Verify routing entrypoints and high-volume datasets
        shell: bash
        run: |
          set -euo pipefail
          test -f AI_BOOTSTRAP.md
          test -f AI_ROUTER.md
          test -f AUTO_FEATURE_READINESS.md
          test -f database/TOOL_DATA_INDEX.md
          test -f database/SUBSYSTEM_SOURCE_MAP.md
          test -f database/SEMANTIC_JOIN_MAP.md
          test -f database/features/CORE_METHOD_RVA_INDEX.csv
          test -f database/features/FEATURE_METHOD_MAP.csv
          test -f database/features/FEATURE_ASSET_MAP.csv
          test -f database/dotnet/DEVICE_STATE_CATALOG.csv
          test -f database/dotnet/METHOD_CATALOG_0001_0600.csv
          test -f database/dotnet/METHOD_CATALOG_0601_1200.csv
          test -f database/dotnet/METHOD_CATALOG_1201_1294.csv
          test -f database/dotnet/PDB_IDENTIFIERS.csv
          test -f database/control/CONTROL_CALL_CHAINS.csv
          test -f database/control/KAUTOHELPER_CALL_GRAPH.csv
          test -f database/assets/ASSET_ROLE_CATALOG.csv
          test -f database/assets/IMAGE_TEMPLATE_INDEX_0001_0700.csv
          test -f database/assets/IMAGE_TEMPLATE_INDEX_0701_1393.csv
          test -f database/snapshot/ARTIFACT_MANIFEST_0001_0750.csv
          test -f database/snapshot/ARTIFACT_MANIFEST_0751_1450.csv
          test -f research/AUTO_RUNTIME_PROOF_QUEUE.md
