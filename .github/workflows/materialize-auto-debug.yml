name: Validate DATA-333 canonical database

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Optional frozen Debug directory/ZIP path inside repository; donor hashes are verified when supplied'
        required: false
        default: ''
  push:
    paths:
      - 'database/**'
      - 'analysis/**'
      - 'research/**'
      - 'tools/materialize_auto_debug.py'
      - '.github/workflows/materialize-auto-debug.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate canonical DATA-333 database
        shell: bash
        env:
          SOURCE_PATH: ${{ github.event.inputs.source || '' }}
        run: |
          set -euo pipefail
          if [ -n "$SOURCE_PATH" ]; then
            if [ ! -e "$SOURCE_PATH" ]; then
              echo "Requested source '$SOURCE_PATH' does not exist"
              exit 1
            fi
            python tools/materialize_auto_debug.py --source "$SOURCE_PATH" --validate-only --repo-root .
          else
            python tools/materialize_auto_debug.py --validate-only --repo-root .
          fi

      - name: Verify routing entrypoints
        shell: bash
        run: |
          set -euo pipefail
          test -f AI_BOOTSTRAP.md
          test -f AI_ROUTER.md
          test -f AUTO_FEATURE_READINESS.md
          test -f database/TOOL_DATA_INDEX.md
          test -f database/SUBSYSTEM_SOURCE_MAP.md
          test -f database/SEMANTIC_JOIN_MAP.md
          test -f database/features/CORE_METHOD_RVA_INDEX.csv
          test -f database/dotnet/DEVICE_STATE_CATALOG.csv
          test -f database/control/CONTROL_CALL_CHAINS.csv
          test -f database/assets/ASSET_ROLE_CATALOG.csv
          test -f research/AUTO_RUNTIME_PROOF_QUEUE.md
          echo 'DATA-333 routing and evidence surfaces present.'
